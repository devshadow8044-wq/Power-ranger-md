<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GalsenApp – Paramètres</title>
<script>try{var t=localStorage.getItem("th");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="set">
 <div class="sh"><button class="ib" id="sback" aria-label="Retour"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b>Paramètres</b></div>
 <div class="sb">
  <div class="prof"><div class="av" id="sav"></div><div class="pn"><b id="sname"></b><small id="smail"></small></div><button class="ib" id="sedit" aria-label="Modifier le nom"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg></button></div>
  <button class="si" id="spw"><span class="ic"><svg class="i" viewBox="0 0 24 24"><circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H21M18 12v3"/></svg></span><span><b>Compte</b><small>Changer le mot de passe par email</small></span></button>
  <button class="si" data-soon="Confidentialité"><span class="ic"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><span><b>Confidentialité</b><small>Comptes bloqués, messages éphémères</small></span></button>
  <button class="si" data-soon="Discussions"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M5 5h14v10H10l-5 4z"/></svg></span><span><b>Discussions</b><small>Fonds d’écran, historique des discussions</small></span></button>
  <button class="si" id="sth"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 0 16c1.5 0 2-1 1.5-2s0-2 1.500-2H17a3 3 0 0 0 3-3c0-4-3.500-9-8-9z"/></svg></span><span><b>Apparence</b><small id="sthv"></small></span></button>
  <button class="si" data-soon="Notifications"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg></span><span><b>Notifications</b><small>Sons des messages et des groupes</small></span></button>
  <button class="si" id="sout"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M10 5H5v14h5M15 8l4 4-4 4M19 12H9"/></svg></span><span><b>Déconnexion</b><small>Quitter ton compte sur cet appareil</small></span></button>
 </div>
</div>
<input type="file" id="pf" accept="image/*" hidden>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script src="firebase.js"></script>
<script>
requireUser(me => {
  let mine = {};
  const TH = { "": "automatique", light: "clair", dark: "sombre" }, thNow = () => document.documentElement.dataset.theme || "";
  const fill = () => {
    const n = mine.name || me.displayName || me.email;
    setAv($("#sav"), Object.assign({}, mine, { name: n })); $("#sav").style.cursor = "pointer";
    $("#sname").textContent = n; $("#smail").textContent = me.email; $("#sthv").textContent = "Thème : " + TH[thNow()];
  };
  db.collection("users").doc(me.uid).onSnapshot(d => { mine = d.data() || {}; fill(); });
  $("#sback").onclick = () => { location.href = "chats.html"; };
  $("#sedit").onclick = async () => {
    const n = prompt("Ton nom", mine.name || ""); if (!n || !n.trim()) return;
    try { await me.updateProfile({ displayName: n.trim() }); await db.collection("users").doc(me.uid).set({ name: n.trim() }, { merge: true }); }
    catch (e) { alert("Le nom n’a pas pu être changé."); }
  };
  $("#sav").onclick = () => $("#pf").click();
  $("#pf").onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try { const d = await toData(f, 256, .8); await db.collection("users").doc(me.uid).set({ photo: d }, { merge: true }); }
    catch (x) { alert("La photo n’a pas pu être changée."); }
  };
  $("#spw").onclick = () => auth.sendPasswordResetEmail(me.email)
    .then(() => alert("Email envoyé à " + me.email + ". Ouvre-le pour changer ton mot de passe."))
    .catch(() => alert("Email non envoyé. Réessaie plus tard."));
  $("#sth").onclick = () => {
    const o = ["", "light", "dark"], nx = o[(o.indexOf(thNow()) + 1) % 3];
    if (nx) document.documentElement.dataset.theme = nx; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem("th", nx); } catch (e) {}
    fill();
  };
  document.querySelectorAll("[data-soon]").forEach(b => b.onclick = () => alert(b.dataset.soon + " : bientôt disponible."));
  $("#sout").onclick = () => auth.signOut();
});
</script>
</body>
</html>
