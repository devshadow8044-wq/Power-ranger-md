<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>App Maçon – Travail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"></div>
<main class="pagew">
 <section id="vList">
  <header class="hd"><div class="avt" id="avt" role="button" aria-label="Mon compte"></div><div class="sp"></div></header>
  <h1 class="hello">Travail</h1>
  <p class="role">Choisis une catégorie.</p>
  <div class="sech"><h2>Catégories</h2><span id="cnt"></span></div>
  <div class="cg" id="cg"></div>
 </section>
 <section id="vCat" class="hide">
  <header class="dh"><button class="rb2" id="back" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div class="sp"></div></header>
  <h1 class="hello" id="dt"></h1>
  <p class="role">Catégorie de travail</p>
  <div class="dban" id="dban"></div>
  <div class="sech"><h2>Contenu</h2><span>0</span></div>
  <div class="soon"><b>Bientôt disponible</b><span>Rien à voir ici pour le moment. Le contenu de cette catégorie arrive bientôt.</span></div>
 </section>
</main>
<nav id="nav"><button data-v="home"><svg viewBox="0 0 24 24"><path class="duo" d="M4.5 11.2 12 4.2l7.5 7v8.3a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1z"/><path d="M9.5 20.5v-4.8a2.5 2.5 0 0 1 5 0v4.8"/><path d="M16.2 7.200V4.500h2v4.600"/></svg><span>Accueil</span></button><button class="on" data-v="work"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg><span>Travail</span></button><button data-v="crew"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17.5 14c2.8 0 4 1.8 4 5"/></svg><span>Ouvriers</span></button><button data-v="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>Compte</span></button></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script src="firebase.js"></script>
<script>
// ---- catégories : mets le lien de la photo dans "photo" quand tu l'as ----
const CATS = [
  { id: "batiment",  nom: "Bâtiment",          photo: "", icon: '<path d="M5 20V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v15"/><path d="M15 9h3a1 1 0 0 1 1 1v10M3 20h18M9 8h2M9 12h2M9 16h2"/>' },
  { id: "fondation", nom: "Fondation",         photo: "", icon: '<path d="M3 20h18M5 20v-4h14v4M7 16v-4h10v4M9 12V8h6v4"/>' },
  { id: "piscine",   nom: "Piscine",           photo: "", icon: '<path d="M3 17c1.500 0 1.500 1 3 1s1.500-1 3-1 1.500 1 3 1 1.500-1 3-1 1.500 1 3 1 1.500-1 3-1M3 13c1.500 0 1.500 1 3 1s1.500-1 3-1 1.500 1 3 1 1.500-1 3-1 1.500 1 3 1 1.500-1 3-1M8 11V5a2 2 0 0 1 4 0M14 11V5a2 2 0 0 1 4 0"/>' },
  { id: "finitions", nom: "Finitions",         photo: "", icon: '<rect x="4" y="4" width="13" height="6" rx="2"/><path d="M17 7h2a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-7v3"/><rect x="10" y="15" width="4" height="6" rx="1.500"/>' },
  { id: "coffrage",  nom: "Coffrage bâtiment", photo: "", icon: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.500h16M4 14.500h16M9.500 4v16M14.500 4v16"/>' }
];
const ini = s => s.trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
const ico = p => '<svg viewBox="0 0 24 24">' + p + '</svg>';
function pic(box, c) {
  box.innerHTML = "";
  if (c.photo) { const im = document.createElement("img"); im.src = c.photo; im.alt = ""; box.appendChild(im); } else box.innerHTML = ico(c.icon);
}
auth.onAuthStateChanged(u => {
  if (!u || !u.emailVerified) { if (u) auth.signOut(); location.replace("index.html"); return; }
  $("#avt").textContent = ini(u.displayName || u.email);
  $("#avt").onclick = () => { location.href = "compte.html"; };
  $("#cnt").textContent = CATS.length;
  const cg = $("#cg");
  CATS.forEach(c => {
    const b = document.createElement("button"); b.className = "cc";
    b.innerHTML = '<div class="cph"></div><div class="cn"></div><div class="cv">Voir ' + ico('<path d="M9 5l7 7-7 7"/>') + '</div>';
    pic(b.querySelector(".cph"), c); b.querySelector(".cn").textContent = c.nom;
    b.onclick = () => { location.hash = c.id; };
    cg.appendChild(b);
  });
  function route() {
    const c = CATS.find(x => x.id === location.hash.slice(1));
    $("#vList").classList.toggle("hide", !!c); $("#vCat").classList.toggle("hide", !c);
    if (c) { $("#dt").textContent = c.nom; pic($("#dban"), c); }
    scrollTo(0, 0);
  }
  $("#back").onclick = () => { location.hash = ""; };
  window.addEventListener("hashchange", route); route();
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    if (v === "home") location.href = "accueil.html"; else if (v === "crew") location.href = "ouvriers.html"; else if (v === "me") location.href = "compte.html"; else { location.hash = ""; }
  });
});
</script>
</body>
</html>
