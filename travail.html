<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>App Maçon – Travail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"></div>
<main class="pagew">
 <section id="vList">
  <header class="hd"><div class="avt" id="avt" role="button" aria-label="Mon compte"></div><div class="sp"></div></header>
  <h1 class="hello">Travail</h1>
  <p class="role">Choisis une catégorie.</p>
  <div class="sech"><h2>Catégories</h2><span id="cnt"></span></div>
  <div class="cg" id="cg"></div>
 </section>
 <section id="vCat" class="hide">
  <header class="dh"><button class="rb2" id="back" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div class="sp"></div></header>
  <h1 class="hello" id="dt"></h1>
  <p class="role">Catégorie de travail</p>
  <div class="dban" id="dban"></div>
  <div class="sech"><h2>Contenu</h2><span>0</span></div>
  <div class="soon"><b>Bientôt disponible</b><span>Rien à voir ici pour le moment. Le contenu de cette catégorie arrive bientôt.</span></div>
 </section>
</main>
<nav id="nav"><button data-v="home"><svg viewBox="0 0 24 24"><path class="duo" d="M4.5 11.2 12 4.2l7.5 7v8.3a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1z"/><path d="M9.5 20.5v-4.8a2.5 2.5 0 0 1 5 0v4.8"/><path d="M16.2 7.200V4.500h2v4.600"/></svg><span>Accueil</span></button><button class="on" data-v="work"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg><span>Travail</span></button><button data-v="crew"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17.5 14c2.8 0 4 1.8 4 5"/></svg><span>Ouvriers</span></button><button data-v="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>Compte</span></button></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script src="firebase.js"></script>
<script>
// ---- illustrations (remplace-les par de vraies photos quand tu veux) ----
const svgUri = s => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
const FIN_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2b38"/><stop offset="1" stop-color="#15151d"/></linearGradient><linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2fc86"/><stop offset="1" stop-color="#9bd11a"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#f7d154"/><stop offset="1" stop-color="#b8860b"/></linearGradient><linearGradient id="roll" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#d8e8a0"/><stop offset="1" stop-color="#9bd11a"/></linearGradient><linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="400" height="260" fill="url(#bg)"/><rect width="400" height="186" fill="#8e8e9c"/><g stroke="#7b7b89" stroke-width="2" opacity=".6"><path d="M20 40l18 6M60 120l24-4M110 70l16 8M150 150l20 4M40 160l14-6M120 20l22 4"/></g><path d="M214 0C236 34 196 76 220 112S200 160 208 186H400V0Z" fill="url(#lime)"/><path d="M214 0C236 34 196 76 220 112S200 160 208 186H240C232 150 252 118 232 84S250 30 238 0Z" fill="#fff" opacity=".18"/><g stroke="#fff" stroke-width="3" opacity=".12"><path d="M270 20v150M320 10v160M370 20v150"/></g><rect y="186" width="400" height="16" fill="#f4efe2"/><rect y="200" width="400" height="3" fill="#00000030"/><g><rect y="203" width="400" height="57" fill="#15151d"/><g fill="url(#gold)"><rect x="0" y="206" width="94" height="24"/><rect x="98" y="206" width="94" height="24"/><rect x="196" y="206" width="94" height="24"/><rect x="294" y="206" width="106" height="24"/><rect x="-46" y="234" width="94" height="26" opacity=".85"/><rect x="52" y="234" width="94" height="26" opacity=".85"/><rect x="150" y="234" width="94" height="26" opacity=".85"/><rect x="248" y="234" width="94" height="26" opacity=".85"/><rect x="346" y="234" width="94" height="26" opacity=".85"/></g><path d="M0 206h400v8H0z" fill="#fff" opacity=".25"/></g><g transform="translate(0 6)"><rect x="132" y="70" width="104" height="38" rx="19" fill="url(#roll)"/><rect x="132" y="70" width="104" height="38" rx="19" fill="url(#sh)"/><ellipse cx="228" cy="89" rx="8" ry="19" fill="#9bd11a" opacity=".55"/><path d="M236 89h18q22 0 22 22v14" fill="none" stroke="#2a2a36" stroke-width="6" stroke-linecap="round"/><rect x="268" y="122" width="16" height="52" rx="8" fill="url(#gold)"/><rect x="268" y="132" width="16" height="4" fill="#b8860b" opacity=".6"/><rect x="268" y="146" width="16" height="4" fill="#b8860b" opacity=".6"/></g><g transform="translate(40 120) rotate(-18)"><rect x="0" y="0" width="56" height="30" rx="4" fill="#e9e9ef"/><rect x="0" y="0" width="56" height="8" rx="4" fill="#fff"/><rect x="56" y="10" width="34" height="10" rx="5" fill="url(#gold)"/></g><circle cx="338" cy="44" r="3" fill="#fff" opacity=".6"/><circle cx="352" cy="62" r="2" fill="#fff" opacity=".5"/><path d="M322 24l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fff6c2" opacity=".85"/></svg>`;
const COF_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2b38"/><stop offset="1" stop-color="#15151d"/></linearGradient><linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9a05f"/><stop offset=".5" stop-color="#c58b4e"/><stop offset="1" stop-color="#a96f36"/></linearGradient><linearGradient id="conc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9c9d3"/><stop offset="1" stop-color="#8d8d9a"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#f7d154"/><stop offset="1" stop-color="#b8860b"/></linearGradient><linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2fc86"/><stop offset="1" stop-color="#9bd11a"/></linearGradient></defs><rect width="400" height="260" fill="url(#bg)"/><rect y="214" width="400" height="46" fill="#3a3a48"/><rect y="214" width="400" height="5" fill="#f7d154" opacity=".7"/><rect x="118" y="120" width="164" height="94" fill="url(#conc)"/><path d="M118 120q20-8 41 0t41 0 41 0 41 0v6H118z" fill="#dcdce4"/><g fill="#7c7c89" opacity=".5"><circle cx="150" cy="160" r="3"/><circle cx="200" cy="185" r="2.500"/><circle cx="250" cy="150" r="3"/><circle cx="170" cy="200" r="2"/><circle cx="235" cy="196" r="2.500"/></g><g stroke="url(#lime)" stroke-width="4" stroke-linecap="round"><path d="M148 52v160M178 52v160M222 52v160M252 52v160"/></g><g stroke="#9bd11a" stroke-width="3" opacity=".95"><path d="M144 74h112M144 104h112M144 134h112M144 164h112M144 194h112"/></g><g><rect x="92" y="40" width="26" height="174" fill="url(#wood)" rx="2"/><rect x="282" y="40" width="26" height="174" fill="url(#wood)" rx="2"/></g><g stroke="#7a4d1d" stroke-width="2" opacity=".75"><path d="M92 82h26M92 124h26M92 166h26M282 82h26M282 124h26M282 166h26"/></g><g stroke="#fff" stroke-width="2" opacity=".18"><path d="M98 44v166M112 44v166M288 44v166M302 44v166"/></g><g><rect x="84" y="70" width="42" height="9" rx="3" fill="#2a2a36"/><rect x="274" y="70" width="42" height="9" rx="3" fill="#2a2a36"/><rect x="84" y="150" width="42" height="9" rx="3" fill="#2a2a36"/><rect x="274" y="150" width="42" height="9" rx="3" fill="#2a2a36"/></g><g fill="url(#gold)"><circle cx="86" cy="74.500" r="5"/><circle cx="314" cy="74.500" r="5"/><circle cx="86" cy="154.500" r="5"/><circle cx="314" cy="154.500" r="5"/></g><g stroke="#e4e4ec" stroke-width="7" stroke-linecap="round"><path d="M92 90L38 206M308 90L362 206"/></g><g stroke="#9a9aa8" stroke-width="2" opacity=".8"><path d="M82 112L48 186M318 112L352 186"/></g><g fill="url(#gold)"><rect x="24" y="206" width="30" height="8" rx="2"/><rect x="346" y="206" width="30" height="8" rx="2"/></g><path d="M168 8h64l-12 26h-40z" fill="url(#gold)"/><path d="M168 8h64l-3 7h-58z" fill="#fff" opacity=".35"/><path d="M190 34h20v10q0 10-5 12v36h-10V56q-5-2-5-12z" fill="url(#conc)"/><ellipse cx="200" cy="112" rx="10" ry="4" fill="#dcdce4"/><circle cx="338" cy="36" r="3" fill="#fff" opacity=".6"/><path d="M60 40l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fff6c2" opacity=".85"/></svg>`;
// ---- catégories : mets le lien de la photo dans "photo" quand tu l'as ----
const CATS = [
  { id: "batiment",  nom: "Bâtiment",          photo: "https://files.catbox.moe/38qgep.jpg", icon: '<path d="M5 20V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v15"/><path d="M15 9h3a1 1 0 0 1 1 1v10M3 20h18M9 8h2M9 12h2M9 16h2"/>' },
  { id: "fondation", nom: "Fondation",         photo: "https://files.catbox.moe/k7i63y.jpg", icon: '<path d="M3 20h18M5 20v-4h14v4M7 16v-4h10v4M9 12V8h6v4"/>' },
  { id: "piscine",   nom: "Piscine",           photo: "https://files.catbox.moe/kgg7ld.jpg", icon: '<path d="M3 17c1.500 0 1.500 1 3 1s1.500-1 3-1 1.500 1 3 1 1.500-1 3-1 1.500 1 3 1 1.500-1 3-1M3 13c1.500 0 1.500 1 3 1s1.500-1 3-1 1.500 1 3 1 1.500-1 3-1 1.500 1 3 1 1.500-1 3-1M8 11V5a2 2 0 0 1 4 0M14 11V5a2 2 0 0 1 4 0"/>' },
  { id: "finitions", nom: "Finitions",         photo: svgUri(FIN_SVG), icon: '<rect x="4" y="4" width="13" height="6" rx="2"/><path d="M17 7h2a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-7v3"/><rect x="10" y="15" width="4" height="6" rx="1.500"/>' },
  { id: "coffrage",  nom: "Coffrage bâtiment", photo: svgUri(COF_SVG), icon: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.500h16M4 14.500h16M9.500 4v16M14.500 4v16"/>' }
];
const ini = s => s.trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
const ico = p => '<svg viewBox="0 0 24 24">' + p + '</svg>';
function pic(box, c) {
  box.innerHTML = "";
  if (c.photo) { const im = document.createElement("img"); im.src = c.photo; im.alt = ""; im.referrerPolicy = "no-referrer"; box.appendChild(im); } else box.innerHTML = ico(c.icon);
}
auth.onAuthStateChanged(u => {
  if (!u || !u.emailVerified) { if (u) auth.signOut(); location.replace("index.html"); return; }
  $("#avt").textContent = ini(u.displayName || u.email);
  $("#avt").onclick = () => { location.href = "compte.html"; };
  $("#cnt").textContent = CATS.length;
  const cg = $("#cg");
  CATS.forEach(c => {
    const b = document.createElement("button"); b.className = "cc";
    b.innerHTML = '<div class="cph"></div><div class="cn"></div><div class="cv">Voir ' + ico('<path d="M9 5l7 7-7 7"/>') + '</div>';
    pic(b.querySelector(".cph"), c); b.querySelector(".cn").textContent = c.nom;
    b.onclick = () => { location.hash = c.id; };
    cg.appendChild(b);
  });
  function route() {
    const c = CATS.find(x => x.id === location.hash.slice(1));
    $("#vList").classList.toggle("hide", !!c); $("#vCat").classList.toggle("hide", !c);
    if (c) { $("#dt").textContent = c.nom; pic($("#dban"), c); }
    scrollTo(0, 0);
  }
  $("#back").onclick = () => { location.hash = ""; };
  window.addEventListener("hashchange", route); route();
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    if (v === "home") location.href = "accueil.html"; else if (v === "crew") location.href = "ouvriers.html"; else if (v === "me") location.href = "compte.html"; else { location.hash = ""; }
  });
});
</script>
</body>
</html>
