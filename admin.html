<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GalsenApp – Admin</title>
<script>try{var t=localStorage.getItem("th");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pg">
 <div class="bar"><button class="ib" id="back" aria-label="Retour"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b>Admin</b></div>
 <div id="deny" class="nb hide" style="padding:24px">Accès refusé.</div>
 <div id="panel" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div class="nb" style="padding-top:14px"><b id="cnt"></b></div>
  <div style="display:flex;gap:8px;padding:0 16px 8px"><button class="rb" id="ann" style="flex:1;border-radius:24px;font-size:15px">Écrire une annonce</button><button class="rb" id="chg" style="flex:1;border-radius:24px;font-size:15px">Changer le code</button></div>
  <div id="searchw"><input id="search" placeholder="Chercher un nom, un email ou un numéro…"></div>
  <div id="list"></div>
 </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script src="firebase.js"></script>
<script>
requireUser(async me => {
  $("#back").onclick = () => { location.href = "chats.html"; };
  const deny = () => { $("#deny").classList.remove("hide"); };
  if (me.email.toLowerCase() !== OWNER_EMAIL.toLowerCase()) return deny();
  const ref = db.collection("config").doc("admin");
  let snap; try { snap = await ref.get(); } catch (e) { return deny(); }
  if (!snap.exists) {
    const c = prompt("Crée ton code secret admin (6 caractères minimum)");
    if (!c || c.length < 6) return deny();
    await ref.set({ code: c });
  } else if (prompt("Code secret admin") !== snap.data().code) { alert("Code incorrect."); return deny(); }
  $("#panel").classList.remove("hide");
  $("#ann").onclick = () => { location.href = "chat.html?id=" + ANN; };
  $("#chg").onclick = async () => { const c = prompt("Nouveau code secret (6 caractères minimum)"); if (c && c.length >= 6) { await ref.set({ code: c }); alert("Code changé."); } };
  let users = [];
  const render = () => {
    const q = $("#search").value.toLowerCase().trim(), qd = digits(q), l = $("#list"); l.innerHTML = "";
    $("#cnt").textContent = users.length + " utilisateur(s)";
    users.filter(u => !q || ((u.name || "") + " " + (u.email || "")).toLowerCase().includes(q) || (qd.length >= 3 && digits(u.phone).includes(qd))).forEach(u => {
      const b = document.createElement("div"); b.className = "item";
      b.innerHTML = '<div class="av"></div><div class="bx"><div class="r1"><b></b></div><div class="r2"><span class="lm"></span></div></div>';
      setAv(b.querySelector(".av"), u); b.querySelector("b").textContent = u.name || u.email;
      b.querySelector(".lm").textContent = (u.email || "") + (u.phone ? " · " + u.phone : "");
      l.appendChild(b);
    });
  };
  db.collection("users").onSnapshot(s => { users = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); });
  $("#search").oninput = render;
});
</script>
</body>
</html>
