<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GalsenApp – Appels</title>
<script>try{var t=localStorage.getItem("th");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pg">
 <div class="head"><h2>Appels</h2></div>
 <div id="list">
  <div class="sec">Favoris</div><div class="nb">Aucun favori pour le moment.</div>
  <div class="sec">Récents</div><div class="nb">Aucun appel récent. Les appels voix et vidéo arrivent bientôt.</div>
 </div>
 <button id="fab" aria-label="Nouvel appel"><svg class="i" viewBox="0 0 24 24"><path d="M6 4l3 1 1 4-2 1.5a11 11 0 0 0 5.5 5.5L15 14l4 1 1 3-2 2C10 20 4 13 4 6z"/></svg></button>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script src="firebase.js"></script>
<script>
requireUser(me => { mountTabs("appels"); $("#fab").onclick = () => alert("Les appels arrivent bientôt."); });
</script>
</body>
</html>
