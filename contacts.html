<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GalsenApp – Contacts</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="hide">
<div class="page" style="position:relative">
 <div class="bar"><b>Contacts</b>
  <button class="ic hide" id="pick" title="Importer depuis le téléphone" data-ic="download"></button>
  <button class="ic" id="add" title="Ajouter un contact" data-ic="plus"></button>
 </div>
 <input class="search" id="search" placeholder="Rechercher un contact">
 <div class="content" id="list"></div>
</div>
<div class="modal hide" id="modal">
 <form id="cf" novalidate>
  <h2>Ajouter un contact</h2>
  <div class="f"><label for="cn">Nom</label><input id="cn" placeholder="Awa Ndiaye" autocomplete="off"></div>
  <div class="f"><label for="cp">Numéro de téléphone</label><input id="cp" type="tel" placeholder="+221 77 000 00 00" autocomplete="off"></div>
  <div id="err" style="color:#ff8a9b;font-size:14px;margin:4px"></div>
  <div class="btns"><button type="button" class="go sm ghost" id="cc">Annuler</button><button class="go sm">Enregistrer</button></div>
 </form>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script src="js/core.js"></script>
<script src="js/contacts.js"></script>
</body>
</html>
