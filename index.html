<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>App Maçon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"></div>
<form id="af" novalidate>
  <div class="top">
   <div class="logo"><svg viewBox="0 0 26 26"><path d="M13 4C7.800 4 4 7.500 4 12c0 2 .8 3.800 2.200 5.100L5 22l4.600-1.700c1 .3 2.200.5 3.400.5 5.200 0 9-3.500 9-8.400S18.200 4 13 4z"/></svg></div>
   <b>App <i>Maçon</i></b>
   <div id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
  <h1 id="tt"></h1><p id="st"></p>
  <div class="tabs"><button type="button" id="tabS">Inscription</button><button type="button" id="tabL">Connexion</button></div>
  <div class="pph hide" id="pph"><button type="button" class="pslot" id="pbtn" aria-label="Ajouter une photo de profil"><svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h2l1.500-2h5L16 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.500" r="3.500"/></svg></button><small>Photo de profil (facultatif)</small><input type="file" id="pfile" accept="image/*" class="hide"></div>
  <div class="f" data-s="1"><label for="fn">Prénom</label><div class="fi"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><input id="fn" type="text" placeholder="Samy" autocomplete="given-name"></div><small class="e"></small></div>
  <div class="f" data-s="1"><label for="ln">Nom</label><div class="fi"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><input id="ln" type="text" placeholder="Diallo" autocomplete="family-name"></div><small class="e"></small></div>
  <div class="f" data-s="2"><label for="ph">Numéro de téléphone</label><div class="fi"><svg viewBox="0 0 24 24"><path d="M6 4l3 1 1 4-2 1.5a11 11 0 0 0 5.5 5.5L15 14l4 1 1 3-2 2C10 20 4 13 4 6z"/></svg><input id="ph" type="tel" placeholder="+221 77 000 00 00" autocomplete="tel"></div><small class="e"></small></div>
  <div class="f" data-s="2" data-l="1"><label for="em">Email</label><div class="fi"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg><input id="em" type="email" placeholder="toi@exemple.com" autocomplete="email"></div><small class="e"></small></div>
  <div class="f" data-s="3" data-l="1"><label for="pw">Mot de passe</label><div class="fi"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="pw" type="password" placeholder="8 caractères, lettres et chiffres" autocomplete="new-password"><button type="button" class="eye" data-t="pw" aria-label="Afficher le mot de passe"><svg viewBox="0 0 24 24"><path d="M2 12s3.600-7 10-7 10 7 10 7-3.600 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="meter" id="meter" data-l="0"><i></i><i></i><i></i><i></i></div><small class="mt" id="mtxt"></small><small class="e"></small></div>
  <div class="f" data-s="3"><label for="pc">Confirmer le mot de passe</label><div class="fi"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="pc" type="password" placeholder="Retape le mot de passe" autocomplete="new-password"><button type="button" class="eye" data-t="pc" aria-label="Afficher le mot de passe"><svg viewBox="0 0 24 24"><path d="M2 12s3.600-7 10-7 10 7 10 7-3.600 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div><small class="e"></small></div>
  <div class="f" data-s="3"><label for="cp">Vérification de sécurité</label><div class="cap"><canvas id="cv" width="220" height="60" aria-label="Code de vérification"></canvas><button type="button" id="cr" aria-label="Nouveau code"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.400-5.700"/><path d="M20 4v5h-5"/></svg></button></div><div class="fi"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.500-3 8-7 10-4-2-7-5.500-7-10V6z"/><path d="M9 12l2.200 2.200L15.500 10"/></svg><input id="cp" type="text" placeholder="Recopie les lettres ci-dessus" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="5"></div><small class="e"></small></div>
  <input type="text" id="hp" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  <div id="err"></div>
  <div class="sp"></div>
  <button class="go" id="ab"></button>
  <button type="button" id="bk">← Retour</button>
  <div class="trust"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>Connexion sécurisée · Tes données sont protégées</span></div>
 </form>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script src="firebase.js"></script>
<script>
let signup;
// ---- fenêtre succès / erreur ----
function popup(type, msg, cb) {
  const old = document.getElementById("pop"); if (old) old.remove();
  const ok = type === "ok", o = document.createElement("div"); o.id = "pop"; o.className = "pop " + type;
  o.innerHTML = '<div class="pbox" role="alertdialog" aria-modal="true"><div class="pic"><svg viewBox="0 0 24 24">' + (ok ? '<path d="M5 12.500l4.500 4.500L19 7.500"/>' : '<path d="M6 6l12 12M18 6L6 18"/>') + '</svg>' + (ok ? Array.from({ length: 8 }, (_, k) => '<i class="spk" style="--a:' + k * 45 + 'deg"></i>').join("") : "") + '</div><h3>' + (ok ? "Succès" : "Erreur") + '</h3><p></p><button type="button" class="go pok">OK</button></div>';
  o.querySelector("p").textContent = msg; document.body.appendChild(o);
  const b = o.querySelector(".pok"); let done = false;
  const close = () => { if (done) return; done = true; o.remove(); if (cb) cb(); };
  b.onclick = close; o.onclick = e => { if (e.target === o) close(); }; b.focus();
}

// ---- connexion / inscription (3 étapes) ----
let step = 1; signup = true;
const T = { 1: ["Créons ton compte", "Commence par ton prénom et ton nom.", "Suivant →"], 2: ["Tes contacts", "Ajoute ton numéro et ton email.", "Suivant →"], 3: ["Dernière étape", "Choisis un mot de passe sûr.", "Créer mon compte"], L: ["Content de te revoir", "Connecte-toi à ton compte.", "Se connecter"] };
const V = {
  fn: v => v.trim() ? "" : "Ton prénom est requis",
  ln: v => v.trim() ? "" : "Ton nom est requis",
  ph: v => v.replace(/\D/g, "").length >= 8 ? "" : "Entre un numéro valide",
  em: v => /^\S+@\S+\.\S+$/.test(v.trim()) ? "" : "Entre un email valide",
  pw: v => signup ? (v.length >= 8 && /[A-Za-z]/.test(v) && /\d/.test(v) ? "" : "8 caractères minimum, avec lettres et chiffres") : (v.length >= 6 ? "" : "6 caractères minimum"),
  pc: v => v === $("#pw").value ? "" : "Les mots de passe sont différents",
  cp: v => { if (v.trim().toUpperCase() === code) return ""; setTimeout(() => { drawCap(); $("#cp").value = ""; }, 0); return "Code incorrect, un nouveau code a été généré"; }
};
// ---- captcha (lettres déformées) ----
let code = "", photoData = "", loginFlow = false;
const CAMSVG = $("#pbtn").innerHTML;
function resetPhoto() { photoData = ""; $("#pbtn").innerHTML = CAMSVG; }
function drawCap() {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ", r = new Uint32Array(5); crypto.getRandomValues(r);
  code = Array.from(r, n => A[n % A.length]).join("");
  const c = $("#cv"), x = c.getContext("2d"), W = c.width, H = c.height, rnd = (a, b) => a + Math.random() * (b - a);
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#1b1b24"); g.addColorStop(1, "#0f0f15"); x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 7; i++) { x.strokeStyle = i % 2 ? "rgba(247,209,84,.45)" : "rgba(190,240,70,.4)"; x.lineWidth = rnd(1, 2.2); x.beginPath(); x.moveTo(rnd(0, W), rnd(0, H)); x.bezierCurveTo(rnd(0, W), rnd(0, H), rnd(0, W), rnd(0, H), rnd(0, W), rnd(0, H)); x.stroke(); }
  for (let i = 0; i < 70; i++) { x.fillStyle = "rgba(255,255,255," + rnd(.1, .4) + ")"; x.fillRect(rnd(0, W), rnd(0, H), 1.6, 1.6); }
  const st = W / (code.length + .6);
  Array.from(code).forEach((ch, i) => {
    x.save(); x.translate(st * (i + .8) + rnd(-3, 3), H / 2 + rnd(-8, 8)); x.rotate(rnd(-.5, .5)); x.transform(1, rnd(-.15, .15), rnd(-.25, .25), 1, 0, 0);
    x.font = "800 " + Math.round(rnd(30, 38)) + "px 'Plus Jakarta Sans',Arial,sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
    x.fillStyle = i % 2 ? "#f7d154" : "#c8f04a"; x.shadowColor = "rgba(0,0,0,.7)"; x.shadowBlur = 3; x.fillText(ch, 0, 0); x.restore();
  });
  for (let i = 0; i < 3; i++) { x.strokeStyle = "rgba(255,255,255,.35)"; x.lineWidth = 1.3; x.beginPath(); x.moveTo(0, rnd(8, H - 8)); x.bezierCurveTo(W * .3, rnd(0, H), W * .6, rnd(0, H), W, rnd(8, H - 8)); x.stroke(); }
}
// ---- force du mot de passe ----
function strength(v) {
  let n = 0; if (v.length >= 8) n++; if (/[a-z]/.test(v) && /[A-Z]/.test(v)) n++; if (/\d/.test(v)) n++; if (/[^A-Za-z0-9]/.test(v) || v.length >= 12) n++;
  return v ? Math.max(1, n) : 0;
}
// ---- anti-force brute à la connexion ----
const lockLeft = () => { try { return Math.max(0, Math.ceil(((+localStorage.getItem("am_lock")) - Date.now()) / 1000)); } catch (e) { return lockMem > Date.now() ? Math.ceil((lockMem - Date.now()) / 1000) : 0; } };
let fails = 0, lockMem = 0;
function failed() { if (++fails >= 5) { fails = 0; lockMem = Date.now() + 60000; try { localStorage.setItem("am_lock", lockMem); } catch (e) {} } }
function paint() {
  paint0(); $("#err").classList.remove("okmsg");
  $("#meter").classList.toggle("hide", !signup); $("#mtxt").classList.toggle("hide", !signup);
  $("#pw").placeholder = signup ? "8 caractères, lettres et chiffres" : "Ton mot de passe";
  $("#pw").autocomplete = signup ? "new-password" : "current-password";
  if (signup && step === 3) drawCap();
  $("#pph").classList.toggle("hide", !(signup && step === 1));
}
function paint0() {
  const k = signup ? step : "L";
  $("#tt").textContent = T[k][0]; $("#st").textContent = T[k][1]; $("#ab").textContent = T[k][2];
  document.querySelectorAll(".f").forEach(f => {
    f.classList.toggle("hide", !(signup ? f.dataset.s == step : f.dataset.l));
    f.querySelector(".e").textContent = ""; f.querySelector("input").classList.remove("bad");
  });
  document.querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("on", i < step));
  $("#dots").classList.toggle("hide", !signup);
  $("#bk").classList.toggle("hide", !(signup && step > 1));
  $("#tabS").classList.toggle("on", signup); $("#tabL").classList.toggle("on", !signup);
  $("#err").textContent = "";
}
function check() {
  let ok = true;
  document.querySelectorAll(".f:not(.hide)").forEach(f => {
    const i = f.querySelector("input"), m = V[i.id](i.value);
    f.querySelector(".e").textContent = m; i.classList.toggle("bad", !!m);
    if (m) ok = false;
  });
  return ok;
}
$("#tabS").onclick = () => { signup = true; step = 1; paint(); };
$("#tabL").onclick = () => { signup = false; paint(); };
$("#bk").onclick = () => { step--; paint(); };
$("#af").onsubmit = async e => {
  e.preventDefault(); $("#err").classList.remove("okmsg"); $("#err").textContent = "";
  if ($("#hp").value) return;
  if (!signup && lockLeft() > 0) { popup("err", "Trop d’essais. Réessaie dans " + lockLeft() + " s."); return; }
  if (!check()) return;
  if (signup && step < 3) { step++; paint(); return; }
  const em = $("#em").value.trim(), pw = $("#pw").value;
  try {
    if (signup) {
      const nm = $("#fn").value.trim() + " " + $("#ln").value.trim(), ph = $("#ph").value.replace(/[^\d+]/g, "");
      const c = await auth.createUserWithEmailAndPassword(em, pw);
      await c.user.updateProfile({ displayName: nm });
      await db.collection("users").doc(c.user.uid).set(Object.assign({ name: nm, email: em.toLowerCase(), phone: ph }, photoData ? { photo: photoData } : {}));
      await c.user.sendEmailVerification();
      await auth.signOut(); signup = false; step = 1; resetPhoto(); paint();
      popup("ok", "Compte créé ! Clique sur le lien reçu par email, puis connecte-toi.");
    } else {
      loginFlow = true;
      const c = await auth.signInWithEmailAndPassword(em, pw);
      if (!c.user.emailVerified) { loginFlow = false; await auth.signOut(); popup("err", "Confirme d’abord ton email (regarde aussi les spams)."); }
      else { fails = 0; $("#ab").disabled = true; let gone = false; const go = () => { if (!gone) { gone = true; location.replace("accueil.html"); } }; popup("ok", "Connexion réussie ! Bienvenue.", go); setTimeout(go, 2500); }
    }
  } catch (x) {
    loginFlow = false; $("#ab").disabled = false;
    const m = { "auth/email-already-in-use": "Cet email est déjà utilisé.", "auth/weak-password": "Mot de passe trop court.", "auth/invalid-credential": "Email ou mot de passe incorrect.", "auth/invalid-email": "Email invalide.", "auth/too-many-requests": "Trop d’essais. Réessaie plus tard." };
    if (!signup && (x.code === "auth/invalid-credential" || x.code === "auth/wrong-password")) failed();
    popup("err", m[x.code] || "Erreur : " + x.code);
  }
};
$("#pbtn").onclick = () => $("#pfile").click();
$("#pfile").onchange = e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const S = 320, c = document.createElement("canvas"); c.width = c.height = S; const m = Math.min(img.width, img.height);
    c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S); URL.revokeObjectURL(url);
    photoData = c.toDataURL("image/jpeg", .82);
    const p = document.createElement("img"); p.src = photoData; p.alt = ""; $("#pbtn").innerHTML = ""; $("#pbtn").appendChild(p);
  };
  img.onerror = () => popup("err", "Image non valide.");
  img.src = url;
};
$("#cr").onclick = () => { drawCap(); $("#cp").value = ""; };
$("#cp").oninput = e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, ""); };
$("#pw").oninput = e => { const l = strength(e.target.value); $("#meter").dataset.l = l; $("#mtxt").textContent = ["", "Faible", "Moyen", "Bon", "Excellent"][l]; };
document.querySelectorAll(".eye").forEach(b => b.onclick = () => { const i = $("#" + b.dataset.t); i.type = i.type === "password" ? "text" : "password"; b.classList.toggle("on", i.type === "text"); });
paint();
auth.onAuthStateChanged(u => { if (u && u.emailVerified && !loginFlow) location.replace("accueil.html"); });
</script>
</body>
</html>
