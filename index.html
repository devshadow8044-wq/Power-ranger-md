<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GalsenApp</title>
<style>
:root{--g:#7c3aed;--gd:#5b21b6;--bg:#0b0b12;--out:#6d28d9;--in:#1c1b2a;--tx:#f4f1ff;--mut:#a9a6c0;--line:#2a2840;--side:#12111c;--hd:#181726;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--side)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:inherit}
.hide{display:none!important}
/* connexion */
#auth{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 0,#4c1d95,#0b0b12 60%);padding:20px}
#auth form{background:var(--side);width:100%;max-width:380px;padding:28px;border-radius:12px;display:flex;flex-direction:column;gap:12px}
#auth h1{font-size:30px;color:#a78bfa}
#auth input{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--hd)}
#auth .go{background:linear-gradient(135deg,#8b5cf6,#5b21b6);color:#fff;padding:14px;border-radius:12px;font-weight:600;box-shadow:0 6px 20px rgba(124,58,237,.45);transition:transform .15s,box-shadow .15s}#auth .go:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(124,58,237,.65)}
#auth .sw{color:#a78bfa;font-size:14px}
#err{color:#ff8a9b;font-size:14px;min-height:18px}
/* application */
#app{height:100%;display:grid;grid-template-columns:min(380px,100%) 1fr}
#side{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;background:var(--side)}
.bar{background:var(--hd);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:12px;min-height:60px}
.bar b{flex:1;font-size:18px}
#search{margin:8px 12px;padding:9px 14px;border:0;border-radius:8px;background:var(--hd)}
#list{overflow:auto;flex:1}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.item:hover,.item.on{background:var(--hd)}
.av{width:46px;height:46px;border-radius:50%;background:#3b3858;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.av.ann{background:var(--g)}
.item small{display:block;color:var(--mut);font-size:13px}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
#empty{margin:auto;color:var(--mut);text-align:center;padding:20px}
#chat{display:flex;flex-direction:column;height:100%;min-height:0}
#back{display:none;font-size:22px}
#msgs{flex:1;overflow:auto;padding:14px 8%;display:flex;flex-direction:column;gap:4px}
.m{max-width:75%;padding:7px 10px 5px;border-radius:8px;background:var(--in);align-self:flex-start;box-shadow:0 1px 1px rgba(0,0,0,.13);word-wrap:break-word}
.m.me{background:var(--out);align-self:flex-end}
.m .n{font-size:12.5px;font-weight:600;color:#a78bfa;margin-bottom:2px}
.m .t{font-size:11px;color:var(--mut);text-align:right;margin-top:2px}
.m audio{height:36px;max-width:100%}
#comp{background:var(--hd);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center}
#txt{flex:1;padding:11px 14px;border:0;border-radius:22px;background:var(--side)}
.rb{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#5b21b6);color:#fff;font-size:19px;flex:none;box-shadow:0 3px 12px rgba(124,58,237,.5)}
#rec{flex:1;color:#d33;font-weight:600;padding:0 8px}
#note{padding:14px;text-align:center;color:var(--mut);background:var(--hd);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
@media(max-width:700px){
 #app{grid-template-columns:1fr}
 #main{display:none}
 #app.open #side{display:none}
 #app.open #main{display:flex}
 #back{display:block}
 #msgs{padding:12px}
}
</style>
</head>
<body>

<div id="auth">
 <form id="af">
  <h1>GalsenApp</h1>
  <input id="nm" placeholder="Votre nom" autocomplete="name">
  <input id="ph" type="tel" placeholder="Numéro de téléphone (ex. +221 77 000 00 00)" autocomplete="tel">
  <input id="em" type="email" placeholder="Adresse email" autocomplete="email" required>
  <input id="pw" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="current-password" required>
  <div id="err"></div>
  <button class="go" id="ab">Se connecter</button>
  <button type="button" class="sw" id="sw">Pas de compte ? Créer un compte</button>
 </form>
</div>

<div id="app" class="hide">
 <aside id="side">
  <div class="bar"><b>GalsenApp</b><button id="out" title="Se déconnecter">Déconnexion</button></div>
  <input id="search" placeholder="Rechercher un nom ou un email">
  <div id="list"></div>
 </aside>
 <section id="main">
  <div id="empty">Choisissez une discussion pour commencer.</div>
  <div id="chat" class="hide">
   <div class="bar"><button id="back">←</button><div class="av" id="cav"></div><b id="ctitle"></b></div>
   <div id="msgs"></div>
   <div id="comp">
    <input id="txt" placeholder="Écrire un message" autocomplete="off">
    <span id="rec" class="hide">● <span id="rt">0:00</span></span>
    <button class="rb hide" id="cancel" title="Annuler" style="background:#8696a0">✕</button>
    <button class="rb" id="act" title="Vocal">🎤</button>
   </div>
   <div id="note" class="hide">Seul le propriétaire de GalsenApp peut écrire ici.</div>
  </div>
 </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script>
// ====== À REMPLIR ======
const OWNER_EMAIL = "votre-email@exemple.com"; // le seul compte qui peut écrire dans les annonces
const RECAPTCHA_SITE_KEY = "VOTRE_CLE_RECAPTCHA_V3"; // anti-robot (App Check + reCAPTCHA v3)
firebase.initializeApp({
  apiKey: "VOTRE_API_KEY",
  authDomain: "VOTRE_PROJET.firebaseapp.com",
  projectId: "VOTRE_PROJET",
  appId: "VOTRE_APP_ID"
});
if (!RECAPTCHA_SITE_KEY.startsWith("VOTRE")) firebase.appCheck().activate(RECAPTCHA_SITE_KEY, true);
// =======================

const auth = firebase.auth(), db = firebase.firestore();
const $ = s => document.querySelector(s);
const ANN = "annonces";
let me, users = [], cur = null, unsub = null, signup = false;
let mr, chunks = [], cancelled = false, tick, t0;

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); // reste connecté

// ---- connexion / inscription ----
const setMode = s => {
  signup = s;
  $("#nm").classList.toggle("hide", !s);
  $("#ph").classList.toggle("hide", !s);
  $("#ab").textContent = s ? "Créer mon compte" : "Se connecter";
  $("#sw").textContent = s ? "Déjà un compte ? Se connecter" : "Pas de compte ? Créer un compte";
  $("#err").textContent = "";
};
setMode(false);
$("#sw").onclick = () => setMode(!signup);
$("#af").onsubmit = async e => {
  e.preventDefault(); $("#err").style.color = ""; $("#err").textContent = "";
  const em = $("#em").value.trim(), pw = $("#pw").value, nm = $("#nm").value.trim();
  try {
    if (signup) {
      const ph = $("#ph").value.replace(/[^\d+]/g, "");
      if (!nm) return $("#err").textContent = "Entrez votre nom.";
      if (ph.replace(/\D/g, "").length < 8) return $("#err").textContent = "Entrez un numéro de téléphone valide.";
      const c = await auth.createUserWithEmailAndPassword(em, pw);
      await c.user.updateProfile({ displayName: nm });
      await db.collection("users").doc(c.user.uid).set({ name: nm, email: em.toLowerCase(), phone: ph });
      await c.user.sendEmailVerification();
      await auth.signOut(); setMode(false);
      $("#err").style.color = "#a78bfa";
      $("#err").textContent = "Compte créé. Cliquez sur le lien reçu par email, puis connectez-vous.";
    } else {
      const c = await auth.signInWithEmailAndPassword(em, pw);
      if (!c.user.emailVerified) { await auth.signOut(); $("#err").textContent = "Confirmez d’abord votre email (pensez aux spams)."; }
    }
  } catch (x) {
    const m = { "auth/email-already-in-use": "Cet email est déjà utilisé.", "auth/weak-password": "Mot de passe trop court (6 caractères minimum).", "auth/invalid-credential": "Email ou mot de passe incorrect.", "auth/invalid-email": "Adresse email invalide." };
    $("#err").textContent = m[x.code] || "Erreur : " + x.code;
  }
};
$("#out").onclick = () => auth.signOut();

auth.onAuthStateChanged(u => {
  if (u && !u.emailVerified) { me = null; return; }
  me = u;
  $("#auth").classList.toggle("hide", !!u);
  $("#app").classList.toggle("hide", !u);
  if (!u) { if (unsub) unsub(); cur = null; return; }
  db.collection("users").doc(u.uid).set({ name: u.displayName || u.email, email: u.email.toLowerCase() }, { merge: true });
  db.collection("users").onSnapshot(s => { users = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.id !== u.uid); renderList(); });
});

// ---- liste des discussions ----
const ini = s => (s || "?").trim().slice(0, 1).toUpperCase();
const isOwner = () => me && me.email.toLowerCase() === OWNER_EMAIL.toLowerCase();
const cid = o => [me.uid, o].sort().join("_");
function renderList() {
  const q = $("#search").value.toLowerCase(), l = $("#list");
  l.innerHTML = "";
  const add = (id, title, sub, ann) => {
    const b = document.createElement("button");
    b.className = "item" + (cur === id ? " on" : "");
    b.innerHTML = '<div class="av' + (ann ? " ann" : "") + '"></div><div><span></span><small></small></div>';
    b.querySelector(".av").textContent = ann ? "📢" : ini(title);
    b.querySelector("span").textContent = title;
    b.querySelector("small").textContent = sub;
    b.onclick = () => openChat(id, title, ann);
    l.appendChild(b);
  };
  if (!q || "annonces galsenapp".includes(q)) add(ANN, "Annonces GalsenApp", "Informations officielles", true);
  users.filter(u => (u.name + u.email).toLowerCase().includes(q)).forEach(u => add(cid(u.id), u.name, u.email, false));
}
$("#search").oninput = renderList;

// ---- discussion ----
function openChat(id, title, ann) {
  cur = id;
  $("#empty").classList.add("hide"); $("#chat").classList.remove("hide");
  $("#app").classList.add("open");
  $("#ctitle").textContent = title;
  const av = $("#cav"); av.textContent = ann ? "📢" : ini(title); av.className = "av" + (ann ? " ann" : "");
  const canWrite = !ann || isOwner();
  $("#comp").classList.toggle("hide", !canWrite);
  $("#note").classList.toggle("hide", canWrite);
  renderList();
  if (unsub) unsub();
  unsub = db.collection("chats").doc(id).collection("messages").orderBy("at").limitToLast(100).onSnapshot(s => {
    const box = $("#msgs"); box.innerHTML = "";
    s.docs.forEach(d => {
      const m = d.data(), el = document.createElement("div");
      el.className = "m" + (m.from === me.uid ? " me" : "");
      if (ann) { const n = document.createElement("div"); n.className = "n"; n.textContent = m.name || "GalsenApp"; el.appendChild(n); }
      if (m.type === "voice") { const a = document.createElement("audio"); a.controls = true; a.src = m.audio; el.appendChild(a); }
      else { const p = document.createElement("div"); p.textContent = m.text; el.appendChild(p); }
      const t = document.createElement("div"); t.className = "t";
      t.textContent = (m.at ? m.at.toDate() : new Date()).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      el.appendChild(t); box.appendChild(el);
    });
    box.scrollTop = box.scrollHeight;
  });
}
$("#back").onclick = () => { $("#app").classList.remove("open"); };

const send = data => db.collection("chats").doc(cur).collection("messages").add({
  from: me.uid, name: me.displayName || me.email, at: firebase.firestore.FieldValue.serverTimestamp(), ...data
}).catch(() => alert("Message non envoyé. Vérifiez votre connexion."));

// ---- texte ----
const sendText = () => { const v = $("#txt").value.trim(); if (v) { send({ type: "text", text: v }); $("#txt").value = ""; sync(); } };
$("#txt").onkeydown = e => { if (e.key === "Enter") sendText(); };
const sync = () => { $("#act").textContent = $("#txt").value.trim() ? "➤" : "🎤"; };
$("#txt").oninput = sync;

// ---- vocal (stocké dans le message, 60 s maximum) ----
const stopUI = () => {
  clearInterval(tick); mr = null;
  ["#rec", "#cancel"].forEach(s => $(s).classList.add("hide"));
  $("#txt").classList.remove("hide"); sync();
};
$("#act").onclick = async () => {
  if ($("#txt").value.trim()) return sendText();
  if (mr) { mr.stop(); return; }
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = []; cancelled = false;
    mr = new MediaRecorder(st, { audioBitsPerSecond: 24000 });
    mr.ondataavailable = e => chunks.push(e.data);
    mr.onstop = () => {
      st.getTracks().forEach(t => t.stop());
      const keep = !cancelled; stopUI();
      if (!keep) return;
      const r = new FileReader();
      r.onload = () => send({ type: "voice", audio: r.result });
      r.readAsDataURL(new Blob(chunks, { type: mr ? mr.mimeType : chunks[0].type }));
    };
    mr.start(); t0 = Date.now();
    $("#txt").classList.add("hide"); $("#rec").classList.remove("hide"); $("#cancel").classList.remove("hide");
    $("#act").textContent = "➤";
    tick = setInterval(() => {
      const s = Math.floor((Date.now() - t0) / 1000);
      $("#rt").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      if (s >= 60 && mr) mr.stop();
    }, 500);
  } catch (e) { alert("Autorisez l’accès au micro pour envoyer un vocal."); }
};
$("#cancel").onclick = () => { cancelled = true; if (mr) mr.stop(); };
</script>
</body>
</html>
