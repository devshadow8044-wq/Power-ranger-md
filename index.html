<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a0d">
<title>Proj. Ghost</title>
<style>
:root {
  --bg: #050a0d;
  --ink: #ffffff;
  --line: rgba(255, 255, 255, 0.8);
  --panel: rgba(10, 15, 20, 0.65);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); overflow: hidden; }
body {
  background: var(--bg) url("https://files.catbox.moe/9bf5n2.jpg") center center / cover fixed no-repeat;
  color: var(--ink);
  font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Arrière-plan vidéo et effet de pluie/scanlines */
#bgv { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; background: #050a0d; }
.veil {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, rgba(5,10,13,.4) 0%, rgba(5,10,13,.7) 100%),
              repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 1px, transparent 1px 3px);
}

/* Conteneur principal */
.app { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; padding: 10px 16px; max-width: 480px; margin: 0 auto; width: 100%; }

/* Barre d'état iOS/Android */
.status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: bold; padding: 5px 0 15px; }
.status-left { background: #ff3b30; color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; }
.status-center { background: #229ED9; color: white; padding: 4px 12px; border-radius: 12px; display: flex; align-items: center; gap: 4px; font-size: 11px; }
.status-right { display: flex; align-items: center; gap: 6px; }
.status-right svg { width: 14px; height: 14px; fill: white; }

/* En-tête Telegram */
.header {
  background: rgba(30, 30, 30, 0.85);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.header .back, .header .menu { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
.header .title-box { text-align: center; }
.header .title { font-size: 15px; font-weight: bold; }
.header .subtitle { font-size: 11px; color: #aaa; margin-top: 2px; }

/* Icône centrale */
.icon-center { display: flex; justify-content: center; margin-bottom: 25px; }
.icon-center svg { width: 48px; height: 48px; fill: none; stroke: white; stroke-width: 2; }

/* Carte d'action (Saisie) */
.action-card {
  border: 2px solid var(--line);
  border-radius: 20px;
  background: var(--panel);
  margin-bottom: 30px;
  overflow: hidden;
}
.row-split { display: flex; border-bottom: 2px solid var(--line); }
.row-split button {
  flex: 1; background: transparent; border: none; color: white;
  font: inherit; font-size: 14px; letter-spacing: 1px; padding: 14px 0; cursor: pointer;
}
.row-split button:first-child { border-right: 2px solid var(--line); }
.row-title { text-align: center; font-size: 12px; padding: 8px 0; border-bottom: 2px solid var(--line); color: #ccc; }
.row-input { display: flex; padding: 12px 16px; align-items: center; }
.row-input .prefix { font-size: 16px; margin-right: 10px; color: #fff; }
.row-input input {
  flex: 1; background: transparent; border: none; border-bottom: 2px solid var(--line);
  color: white; font: inherit; font-size: 18px; text-align: center; outline: none; padding-bottom: 4px;
}
.row-input input::placeholder { color: #555; }

/* Bulle de message */
.chat-bubble {
  border: 2px solid var(--line);
  border-radius: 20px;
  background: var(--panel);
  overflow: hidden;
}
.bubble-text { padding: 16px 20px; font-size: 15px; line-height: 1.6; }
.bubble-text span { display: block; margin-top: 4px; }
.bubble-actions { display: flex; border-top: 2px solid var(--line); }
.bubble-actions button {
  flex: 1; background: transparent; border: none; color: white;
  font: inherit; font-size: 14px; letter-spacing: 1px; padding: 14px 0; cursor: pointer;
}
.bubble-actions button:first-child { border-right: 2px solid var(--line); }

/* Résultat du code */
#result { display: none; margin-top: 20px; text-align: center; font-size: 14px; line-height: 1.5; padding: 15px; border: 1px dashed #fff; border-radius: 10px; }
#result.show { display: block; }
.code-val { display: block; font-size: 28px; font-weight: bold; letter-spacing: 4px; margin-top: 10px; color: #fff; }
</style>
</head>
<body>

<video id="bgv" autoplay muted loop playsinline preload="auto" poster="https://files.catbox.moe/9bf5n2.jpg" aria-hidden="true">
  <source src="https://files.catbox.moe/wg8jz6.mp4" type="video/mp4">
</video>
<div class="veil" aria-hidden="true"></div>

<div class="app">
  <!-- Barre d'état -->
  <div class="status-bar">
    <div class="status-left" id="clock">10:12</div>
    <div class="status-center">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      TELEGRAM
    </div>
    <div class="status-right">
      <span>SOS</span>
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
    </div>
  </div>

  <!-- En-tête -->
  <div class="header">
    <div class="back">‹</div>
    <div class="title-box">
      <div class="title">Proj. Ghost</div>
      <div class="subtitle">today at 10:10 AM</div>
    </div>
    <div class="menu">···</div>
  </div>

  <!-- Icône -->
  <div class="icon-center">
    <svg viewBox="0 0 24 24">
      <path d="M12 2a10 10 0 0 0-10 10 10 10 0 0 0 10 10 10 10 0 0 0 10-10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z" stroke-dasharray="4 4"/>
      <path d="M12 6a6 6 0 0 0-6 6 6 6 0 0 0 6 6 6 6 0 0 0 6-6 6 6 0 0 0-6-6zm0 10a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
      <circle cx="12" cy="12" r="2"/>
    </svg>
  </div>

  <!-- Carte de saisie -->
  <div class="action-card">
    <div class="row-split">
      <button type="button" id="btnClose">CLOSE</button>
      <button type="button" id="btnNext">NEXT</button>
    </div>
    <div class="row-title">PROJ GHOST BOT</div>
    <div class="row-input">
      <div class="prefix">+ 7</div>
      <input id="phone" type="tel" inputmode="tel" value="933 443 01 26" maxlength="15">
    </div>
  </div>

  <!-- Bulle de confirmation -->
  <div class="chat-bubble">
    <div class="bubble-text">
      <span id="bubbleNumber">+7 933 443 01 26</span>
      <span>is this the correct number?</span>
    </div>
    <div class="bubble-actions">
      <button type="button" id="btnEdit">EDIT</button>
      <button type="button" id="btnYes">YES</button>
    </div>
  </div>

  <!-- Résultat du pairage -->
  <div id="result" role="status" aria-live="polite"></div>
</div>

<script>
// Gestion de l'arrière-plan vidéo
const bgv = document.getElementById('bgv');
if (bgv) {
  bgv.muted = true;
  const playVid = () => bgv.play().catch(() => {});
  playVid();
  addEventListener('pointerdown', playVid, { once: true });
}

// Horloge dynamique
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = `${h}:${m}`;
}
updateClock();
setInterval(updateClock, 60000);

// Synchronisation de l'input avec la bulle
const phoneInput = document.getElementById('phone');
const bubbleNumber = document.getElementById('bubbleNumber');
phoneInput.addEventListener('input', () => {
  let val = phoneInput.value.trim() || "933 443 01 26";
  bubbleNumber.textContent = `+7 ${val}`;
});

// Bouton EDIT
document.getElementById('btnEdit').addEventListener('click', () => {
  phoneInput.focus();
  phoneInput.select();
});

// Fonction de pairage
const resultDiv = document.getElementById('result');

async function getPairingCode() {
  const rawPhone = phoneInput.value.replace(/\D/g, '');
  const phone = rawPhone.startsWith('7') ? rawPhone : '7' + rawPhone;
  
  if (phone.length < 10) {
    resultDiv.className = 'show';
    resultDiv.textContent = 'Numéro invalide. Vérifie le numéro.';
    return;
  }

  resultDiv.className = 'show';
  resultDiv.innerHTML = 'Génération du code en cours...';

  try {
    // Utilisation de la même API que ton code original
    const r = await fetch('/api/pair', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ number: phone })
    });
    const data = await r.json().catch(() => ({}));
    
    if (!r.ok) throw new Error(data.error || data.message || 'Erreur serveur.');
    
    resultDiv.innerHTML = `Ton code de pairing :<span class="code-val">${data.pairingCode || 'Indisponible'}</span>`;
  } catch (err) {
    resultDiv.textContent = err instanceof TypeError 
      ? "Service indisponible pour le moment. Réessaie plus tard." 
      : err.message;
  }
}

// Boutons NEXT et YES déclenchent la même action
document.getElementById('btnNext').addEventListener('click', getPairingCode);
document.getElementById('btnYes').addEventListener('click', getPairingCode);

// Bouton CLOSE (réinitialise)
document.getElementById('btnClose').addEventListener('click', () => {
  resultDiv.className = '';
  resultDiv.innerHTML = '';
  phoneInput.value = '933 443 01 26';
  bubbleNumber.textContent = '+7 933 443 01 26';
});
</script>

</body>
</html>
