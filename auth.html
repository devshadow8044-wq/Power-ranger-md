<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a0d">
<title>GALSENAPP - Connexion</title>
<style>
/* Variables de couleurs modifiables */
:root { 
  --bg: #09090b; 
  --ink: #ffffff; 
  --line: rgba(255, 255, 255, 0.15); 
  --panel: rgba(10, 15, 20, 0.85); 
  --accent: #ffffff; 
  --glow: rgba(255, 255, 255, 0.4);
  --error: #ff3b30; 
}
body[data-color="cyan"] { --accent: #19e3ff; --glow: rgba(25,227,255,0.4); }
body[data-color="green"] { --accent: #25D366; --glow: rgba(37,211,102,0.4); }
body[data-color="violet"] { --accent: #b36bff; --glow: rgba(179,107,255,0.4); }
body[data-color="red"] { --accent: #ff4d61; --glow: rgba(255,77,97,0.4); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); overflow-x: hidden; }

body { 
  /* LA PHOTO QUE TU AS ENVOYÉE */
  background: #09090b url("https://files.catbox.moe/qlbnfn.png") center center / cover fixed no-repeat; 
  color: var(--ink); 
  font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; 
  height: 100vh; 
  display: flex; 
  flex-direction: column; 
  overflow-y: auto;
  transition: color 0.3s ease;
}
/* Voile sombre pour bien lire le texte sur l'image */
body::before {
  content: ''; position: fixed; inset: 0; background: rgba(5, 10, 15, 0.75); z-index: 0; pointer-events: none;
}

.app { position: relative; z-index: 2; min-height: 100%; display: flex; flex-direction: column; padding: 20px 24px; max-width: 480px; margin: 0 auto; width: 100%; }

/* === LES 5 COULEURS === */
.color-picker {
  display: flex; gap: 15px; justify-content: center; padding: 20px 0 30px;
}
.color-picker button {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.2s;
}
.color-picker button[data-color="white"] { background: #ffffff; }
.color-picker button[data-color="cyan"] { background: #19e3ff; }
.color-picker button[data-color="green"] { background: #25D366; }
.color-picker button[data-color="violet"] { background: #b36bff; }
.color-picker button[data-color="red"] { background: #ff4d61; }
.color-picker button.active {
  border-color: #fff; transform: scale(1.2); box-shadow: 0 0 15px var(--glow);
}

/* En-tête très puissant */
.header { text-align: center; margin-bottom: 30px; }
.header .title { font-size: 32px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); text-shadow: 0 0 20px var(--glow); }
.header .subtitle { font-size: 12px; color: #aaa; margin-top: 8px; letter-spacing: 2px; text-transform: uppercase; }

/* Conteneur des formulaires */
.auth-container { display: none; animation: fadeIn 0.4s ease; width: 100%; }
.auth-container.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

/* Carte (Bulle) */
.action-card { 
  background: var(--panel); 
  border: 1px solid var(--line); 
  border-radius: 24px; 
  padding: 24px; 
  backdrop-filter: blur(15px); 
  box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05); 
}
.row-title { text-align: center; font-size: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--line); color: #fff; font-weight: bold; letter-spacing: 2px; margin-bottom: 20px; }

/* Champs de saisie */
.row-input { display: flex; margin-bottom: 16px; }
.row-input input { 
  width: 100%; height: 56px; padding: 0 16px; 
  background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15); 
  border-radius: 12px; color: white; font: inherit; font-size: 16px; outline: none; transition: 0.3s;
}
.row-input input:focus { border-color: var(--accent); background: rgba(0,0,0,0.7); box-shadow: 0 0 15px var(--glow); }
.row-input input::placeholder { color: #666; }

/* Bouton */
.btn { 
  display: flex; align-items: center; justify-content: center; 
  width: 100%; height: 56px; border-radius: 14px; border: none; 
  background: var(--accent); color: #000; font: inherit; font-size: 16px; font-weight: 800; letter-spacing: 1px; 
  cursor: pointer; transition: 0.3s; margin-top: 10px;
}
.btn:hover { box-shadow: 0 0 25px var(--glow); transform: translateY(-2px); }
.btn:active { transform: translateY(0); }

.switch-link { text-align: center; font-size: 13px; color: #aaa; margin-top: 24px; margin-bottom: 40px; }
.switch-link span { color: var(--accent); text-decoration: none; cursor: pointer; font-weight: bold; border-bottom: 1px solid var(--accent); padding-bottom: 2px; }
.switch-link span:hover { filter: brightness(1.2); }

.footer { text-align: center; font-size: 11px; color: #555; margin-top: auto; padding-top: 20px; }
.msg { text-align: center; font-size: 13px; margin-bottom: 20px; padding: 12px; border-radius: 10px; display: none; font-weight: bold; }
.msg.error { display: block; background: rgba(255,59,48,0.15); color: var(--error); border: 1px solid var(--error); }
.msg.success { display: block; background: rgba(37,211,102,0.15); color: var(--accent); border: 1px solid var(--accent); }
</style>
</head>
<body data-color="white">

<div class="app">
  
  <!-- 5 Couleurs -->
  <div class="color-picker">
    <button data-color="white" class="active" aria-label="Blanc"></button>
    <button data-color="cyan" aria-label="Cyan"></button>
    <button data-color="green" aria-label="Vert"></button>
    <button data-color="violet" aria-label="Violet"></button>
    <button data-color="red" aria-label="Rouge"></button>
  </div>

  <!-- En-tête Puissant -->
  <div class="header">
    <div class="title">GALSENAPP</div>
    <div class="subtitle">L'application la plus puissante</div>
  </div>
  
  <div id="alertMsg" class="msg"></div>

  <!-- CONNEXION -->
  <div class="auth-container active" id="loginSection">
    <div class="action-card">
      <div class="row-title">CONNEXION</div>
      <div class="row-input"><input type="text" id="loginUser" placeholder="Numéro ou Pseudo"></div>
      <div class="row-input"><input type="password" id="loginPass" placeholder="Mot de passe"></div>
      <button class="btn" id="btnLogin">SE CONNECTER</button>
    </div>
    <div class="switch-link">Pas de compte ? <span onclick="toggleAuth('register')">S'inscrire</span></div>
  </div>

  <!-- INSCRIPTION (Sans photo de profil) -->
  <div class="auth-container" id="registerSection">
    <div class="action-card">
      <div class="row-title">CRÉER UN COMPTE</div>
      <div class="row-input"><input type="text" id="regName" placeholder="Nom complet"></div>
      <div class="row-input"><input type="tel" id="regPhone" placeholder="Numéro de téléphone"></div>
      <div class="row-input"><input type="password" id="regPass" placeholder="Mot de passe"></div>
      <button class="btn" id="btnRegister">CRÉER MON COMPTE</button>
    </div>
    <div class="switch-link">Déjà un compte ? <span onclick="toggleAuth('login')">Se connecter</span></div>
  </div>
  
  <div class="footer">Powered by DEV PAPINO ©2026</div>
</div>

<script>
// Sécurité : Si déjà connecté, on redirige
if (localStorage.getItem('galsenapp_user')) { window.location.href = 'index.html'; }

// GESTION DES COULEURS
const colorBtns = document.querySelectorAll('.color-picker button');
const savedColor = localStorage.getItem('galsenapp_color') || 'white';
document.body.dataset.color = savedColor;

colorBtns.forEach(btn => {
  if (btn.dataset.color === savedColor) btn.classList.add('active');
  btn.addEventListener('click', () => {
    document.body.dataset.color = btn.dataset.color;
    localStorage.setItem('galsenapp_color', btn.dataset.color);
    colorBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

function toggleAuth(section) {
  document.getElementById('loginSection').classList.remove('active');
  document.getElementById('registerSection').classList.remove('active');
  if (section === 'login') document.getElementById('loginSection').classList.add('active');
  else document.getElementById('registerSection').classList.add('active');
  document.getElementById('alertMsg').className = 'msg';
}

function showMessage(text, type) { const msg = document.getElementById('alertMsg'); msg.textContent = text; msg.className = 'msg ' + type; }

// CONNEXION
document.getElementById('btnLogin').addEventListener('click', () => {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  if (!user || !pass) { showMessage('Veuillez remplir tous les champs.', 'error'); return; }

  showMessage('Connexion en cours...', 'success');
  setTimeout(() => {
    localStorage.setItem('galsenapp_user', JSON.stringify({ name: user, phone: user }));
    showMessage('Connexion réussie ! Redirection...', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
  }, 1000);
});

// INSCRIPTION
document.getElementById('btnRegister').addEventListener('click', () => {
  const name = document.getElementById('regName').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const pass = document.getElementById('regPass').value.trim();

  if (!name || !phone || !pass) { showMessage('Veuillez remplir tous les champs.', 'error'); return; }

  showMessage('Création du compte en cours...', 'success');
  setTimeout(() => {
    localStorage.setItem('galsenapp_user', JSON.stringify({ name: name, phone: phone }));
    showMessage('Compte créé avec succès ! Redirection...', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
  }, 1000);
});
</script>
</body>
</html>
