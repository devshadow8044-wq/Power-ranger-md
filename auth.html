<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a0d">
<title>BUG DEV PAPINO - Accès</title>
<style>
:root { 
  --bg: #09090b; 
  --ink: #ffffff; 
  --line: rgba(255, 255, 255, 0.15); 
  --panel: rgba(15, 20, 25, 0.85); 
  --accent: #25D366;
  --error: #ff3b30; 
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); overflow-x: hidden; }
body { 
  /* NOUVEL ARRIÈRE-PLAN DIFFÉRENT DE L'INDEX */
  background: #09090b url("https://images.unsplash.com/photo-1614064641938-3bbee52942c7?q=80&w=1000&auto=format&fit=crop") center center / cover fixed no-repeat; 
  color: var(--ink); 
  font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; 
  height: 100vh; 
  display: flex; 
  flex-direction: column; 
  overflow-y: auto;
}
/* Filtre pour assombrir l'image de fond et faire ressortir le texte */
body::before {
  content: ''; position: fixed; inset: 0; background: rgba(5, 10, 15, 0.75); z-index: 0; pointer-events: none;
}
.app { position: relative; z-index: 2; min-height: 100%; display: flex; flex-direction: column; padding: 20px 24px; max-width: 480px; margin: 0 auto; width: 100%; }

/* Barre d'état */
.status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: bold; padding: 10px 0 25px; }
.status-left { background: var(--error); color: white; padding: 5px 14px; border-radius: 14px; font-size: 13px; }
.status-center { background: var(--accent); color: white; padding: 5px 14px; border-radius: 14px; display: flex; align-items: center; gap: 6px; font-size: 12px; }
.status-right { display: flex; align-items: center; gap: 8px; }
.status-right svg { width: 16px; height: 16px; fill: white; }

/* En-tête */
.header { text-align: center; margin-bottom: 40px; margin-top: 20px; }
.header .title { font-size: 22px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 15px rgba(255,255,255,0.3); }
.header .subtitle { font-size: 12px; color: #888; margin-top: 8px; letter-spacing: 1px; }

/* Conteneur des formulaires */
.auth-container { display: none; animation: fadeIn 0.4s ease; width: 100%; }
.auth-container.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

/* Carte (Bulle) */
.action-card { 
  background: var(--panel); 
  border: 1px solid var(--line); 
  border-radius: 24px; 
  padding: 24px; 
  backdrop-filter: blur(15px); 
  box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05); 
}
.row-title { text-align: center; font-size: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--line); color: #fff; font-weight: bold; letter-spacing: 2px; margin-bottom: 20px; }

/* Champs de saisie plus grands */
.row-input { display: flex; margin-bottom: 16px; }
.row-input input { 
  width: 100%; height: 56px; padding: 0 16px; 
  background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); 
  border-radius: 12px; color: white; font: inherit; font-size: 16px; outline: none; transition: 0.3s;
}
.row-input input:focus { border-color: #fff; background: rgba(0,0,0,0.6); box-shadow: 0 0 15px rgba(255,255,255,0.1); }
.row-input input::placeholder { color: #666; }

/* Photo de profil plus grande */
.avatar-upload { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 24px; cursor: pointer; }
.avatar-circle { 
  width: 100px; height: 100px; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.4); 
  display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); 
  overflow: hidden; transition: 0.3s;
}
.avatar-upload:hover .avatar-circle { border-color: #fff; background: rgba(255,255,255,0.1); }
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: none; }
.avatar-circle span { font-size: 12px; color: #aaa; text-align: center; padding: 0 10px; line-height: 1.4; }
.avatar-upload input[type="file"] { display: none; }

/* Bouton plus grand et plus classe */
.btn { 
  display: flex; align-items: center; justify-content: center; 
  width: 100%; height: 56px; border-radius: 14px; border: none; 
  background: #fff; color: #000; font: inherit; font-size: 16px; font-weight: 800; letter-spacing: 1px; 
  cursor: pointer; transition: 0.3s; margin-top: 10px;
}
.btn:hover { background: #e0e0e0; box-shadow: 0 0 20px rgba(255,255,255,0.4); transform: translateY(-2px); }
.btn:active { transform: translateY(0); }

.switch-link { text-align: center; font-size: 13px; color: #aaa; margin-top: 24px; margin-bottom: 40px; }
.switch-link span { color: #fff; text-decoration: none; cursor: pointer; font-weight: bold; border-bottom: 1px solid #fff; padding-bottom: 2px; }
.switch-link span:hover { color: var(--accent); border-color: var(--accent); }

.footer { text-align: center; font-size: 11px; color: #555; margin-top: auto; padding-top: 20px; }
.msg { text-align: center; font-size: 13px; margin-bottom: 20px; padding: 12px; border-radius: 10px; display: none; font-weight: bold; }
.msg.error { display: block; background: rgba(255,59,48,0.15); color: var(--error); border: 1px solid var(--error); }
.msg.success { display: block; background: rgba(37,211,102,0.15); color: var(--accent); border: 1px solid var(--accent); }
</style>
</head>
<body>

<div class="app">
  <div class="status-bar">
    <div class="status-left" id="clock">10:12</div>
    <div class="status-center"><svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:white;"><path d="M12.031 2c-5.514 0-9.986 4.474-9.986 9.987 0 1.761.459 3.481 1.331 5.002L2 22l5.149-1.349a9.94 9.94 0 0 0 4.882 1.278h.004c5.514 0 9.986-4.474 9.986-9.987 0-2.669-1.04-5.176-2.927-7.063A9.935 9.935 0 0 0 12.031 2zm5.83 14.16c-.244.688-1.417 1.314-1.957 1.386-.54.072-1.043.316-3.53-.662-2.992-1.179-4.884-4.25-5.03-4.447-.147-.198-1.177-1.565-1.177-2.985 0-1.42.737-2.115 1.003-2.404.266-.289.578-.361.773-.361h.552c.177 0 .414-.067.647.494.244.59.829 2.025.902 2.17.073.145.122.315.025.507-.098.193-.147.313-.294.484-.147.17-.309.38-.443.51-.148.145-.303.303-.13.594.173.29.768 1.266 1.646 2.047 1.13 1.006 2.077 1.32 2.37 1.467.294.147.465.123.64-.074.174-.198.743-.865.94-1.161.197-.295.395-.245.664-.147.27.098 1.71.807 2.002.954.294.147.49.22.563.345.074.125.074.723-.17 1.41z"/></svg> WhatsApp</div>
    <div class="status-right"><span>SOS</span><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg><svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg></div>
  </div>
  
  <div class="header">
    <div class="title">BUG DEV PAPINO</div>
    <div class="subtitle">Accès sécurisé au bot</div>
  </div>
  
  <div id="alertMsg" class="msg"></div>

  <!-- CONNEXION -->
  <div class="auth-container active" id="loginSection">
    <div class="action-card">
      <div class="row-title">CONNEXION</div>
      <div class="row-input"><input type="text" id="loginUser" placeholder="Numéro ou Pseudo"></div>
      <div class="row-input"><input type="password" id="loginPass" placeholder="Mot de passe"></div>
      <button class="btn" id="btnLogin">SE CONNECTER</button>
    </div>
    <div class="switch-link">Pas de compte ? <span onclick="toggleAuth('register')">S'inscrire</span></div>
  </div>

  <!-- INSCRIPTION -->
  <div class="auth-container" id="registerSection">
    <div class="action-card">
      <div class="row-title">CRÉER UN COMPTE</div>
      <label class="avatar-upload" for="profilePic">
        <div class="avatar-circle"><img id="avatarPreview" src="" alt="Aperçu"><span id="avatarText">Ajouter<br>Photo</span></div>
        <input type="file" id="profilePic" accept="image/*">
      </label>
      <div class="row-input"><input type="text" id="regName" placeholder="Nom complet"></div>
      <div class="row-input"><input type="tel" id="regPhone" placeholder="Numéro de téléphone"></div>
      <div class="row-input"><input type="password" id="regPass" placeholder="Mot de passe"></div>
      <button class="btn" id="btnRegister">CRÉER MON COMPTE</button>
    </div>
    <div class="switch-link">Déjà un compte ? <span onclick="toggleAuth('login')">Se connecter</span></div>
  </div>
  
  <div class="footer">Powered by DEV PAPINO ©2026</div>
</div>

<script>
// Sécurité : Si déjà connecté, on redirige
if (localStorage.getItem('galsenapp_user')) { window.location.href = 'index.html'; }

function updateClock() { const now = new Date(); document.getElementById('clock').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`; }
updateClock(); setInterval(updateClock, 60000);

function toggleAuth(section) {
  document.getElementById('loginSection').classList.remove('active');
  document.getElementById('registerSection').classList.remove('active');
  if (section === 'login') document.getElementById('loginSection').classList.add('active');
  else document.getElementById('registerSection').classList.add('active');
  document.getElementById('alertMsg').className = 'msg';
}

const profilePicInput = document.getElementById('profilePic');
const avatarPreview = document.getElementById('avatarPreview');
const avatarText = document.getElementById('avatarText');
profilePicInput.addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(event) { avatarPreview.src = event.target.result; avatarPreview.style.display = 'block'; avatarText.style.display = 'none'; }
    reader.readAsDataURL(file);
  }
});

function showMessage(text, type) { const msg = document.getElementById('alertMsg'); msg.textContent = text; msg.className = 'msg ' + type; }

// CONNEXION
document.getElementById('btnLogin').addEventListener('click', () => {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  if (!user || !pass) { showMessage('Veuillez remplir tous les champs.', 'error'); return; }

  showMessage('Connexion en cours...', 'success');
  setTimeout(() => {
    localStorage.setItem('galsenapp_user', JSON.stringify({ name: user, phone: user }));
    showMessage('Connexion réussie ! Redirection...', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
  }, 1000);
});

// INSCRIPTION
document.getElementById('btnRegister').addEventListener('click', () => {
  const name = document.getElementById('regName').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const pass = document.getElementById('regPass').value.trim();
  const file = profilePicInput.files[0];

  if (!name || !phone || !pass) { showMessage('Veuillez remplir tous les champs.', 'error'); return; }
  if (!file) { showMessage('Veuillez ajouter une photo de profil.', 'error'); return; }

  showMessage('Création du compte en cours...', 'success');
  setTimeout(() => {
    localStorage.setItem('galsenapp_user', JSON.stringify({ name: name, phone: phone, avatar: avatarPreview.src }));
    showMessage('Compte créé avec succès ! Redirection...', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
  }, 1000);
});
</script>
</body>
</html>
