<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a0d">
<title>BUG DEV PAPINO - Connexion</title>
<style>
:root { --bg: #050a0d; --ink: #ffffff; --line: rgba(255, 255, 255, 0.8); --panel: rgba(10, 15, 20, 0.65); --success: #25D366; --error: #ff3b30; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); overflow-x: hidden; }
body { background: var(--bg) url("https://files.catbox.moe/9bf5n2.jpg") center center / cover fixed no-repeat; color: var(--ink); font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; height: 100vh; display: flex; flex-direction: column; }
#bgv { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; background: #050a0d; }
.veil { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(5,10,13,.4) 0%, rgba(5,10,13,.85) 100%), repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 1px, transparent 1px 3px); }
.app { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; padding: 10px 16px; max-width: 480px; margin: 0 auto; width: 100%; overflow-y: auto; }
.status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: bold; padding: 5px 0 15px; }
.status-left { background: var(--error); color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; }
.status-center { background: var(--success); color: white; padding: 4px 12px; border-radius: 12px; display: flex; align-items: center; gap: 4px; font-size: 11px; }
.status-right { display: flex; align-items: center; gap: 6px; }
.status-right svg { width: 14px; height: 14px; fill: white; }
.header { background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(10px); border-radius: 20px; padding: 8px 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; }
.header .title { font-size: 16px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
.auth-container { display: none; animation: fadeIn 0.4s ease; }
.auth-container.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.action-card { border: 2px solid var(--line); border-radius: 20px; background: var(--panel); margin-bottom: 20px; overflow: hidden; backdrop-filter: blur(10px); }
.row-title { text-align: center; font-size: 13px; padding: 12px 0; border-bottom: 2px solid var(--line); color: #fff; font-weight: bold; letter-spacing: 1px; }
.row-input { display: flex; padding: 15px 16px; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.2); }
.row-input:last-child { border-bottom: none; }
.row-input input { background: transparent; border: none; color: white; font: inherit; outline: none; width: 100%; font-size: 15px; }
.row-input input::placeholder { color: #888; }
.avatar-upload { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; border-bottom: 2px solid var(--line); cursor: pointer; }
.avatar-circle { width: 80px; height: 80px; border-radius: 50%; border: 2px dashed var(--line); display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); overflow: hidden; position: relative; }
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: none; }
.avatar-circle span { font-size: 11px; color: #aaa; text-align: center; padding: 0 10px; }
.avatar-upload input[type="file"] { display: none; }
.btn { display: flex; align-items: center; justify-content: center; width: calc(100% - 32px); margin: 20px 16px; height: 48px; border-radius: 10px; border: none; background: #fff; color: #000; font: inherit; font-size: 14px; font-weight: 800; letter-spacing: 1px; cursor: pointer; transition: transform 0.1s; }
.btn:active { transform: scale(0.98); }
.switch-link { text-align: center; font-size: 12px; color: #aaa; margin-bottom: 20px; }
.switch-link span { color: #fff; text-decoration: underline; cursor: pointer; font-weight: bold; }
.footer { position: fixed; bottom: 10px; left: 0; width: 100%; text-align: center; font-size: 10px; color: #7f9aa3; z-index: 2; pointer-events: none; }
.msg { text-align: center; font-size: 12px; margin-bottom: 15px; padding: 10px; border-radius: 8px; display: none; }
.msg.error { display: block; background: rgba(255,59,48,0.2); color: var(--error); border: 1px solid var(--error); }
.msg.success { display: block; background: rgba(37,211,102,0.2); color: var(--success); border: 1px solid var(--success); }
</style>
</head>
<body>

<video id="bgv" autoplay muted loop playsinline preload="auto" poster="https://files.catbox.moe/9bf5n2.jpg" aria-hidden="true"><source src="https://files.catbox.moe/wg8jz6.mp4" type="video/mp4"></video>
<div class="veil" aria-hidden="true"></div>

<div class="app">
  <div class="status-bar">
    <div class="status-left" id="clock">10:12</div>
    <div class="status-center"><svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:white;"><path d="M12.031 2c-5.514 0-9.986 4.474-9.986 9.987 0 1.761.459 3.481 1.331 5.002L2 22l5.149-1.349a9.94 9.94 0 0 0 4.882 1.278h.004c5.514 0 9.986-4.474 9.986-9.987 0-2.669-1.04-5.176-2.927-7.063A9.935 9.935 0 0 0 12.031 2zm5.83 14.16c-.244.688-1.417 1.314-1.957 1.386-.54.072-1.043.316-3.53-.662-2.992-1.179-4.884-4.25-5.03-4.447-.147-.198-1.177-1.565-1.177-2.985 0-1.42.737-2.115 1.003-2.404.266-.289.578-.361.773-.361h.552c.177 0 .414-.067.647.494.244.59.829 2.025.902 2.17.073.145.122.315.025.507-.098.193-.147.313-.294.484-.147.17-.309.38-.443.51-.148.145-.303.303-.13.594.173.29.768 1.266 1.646 2.047 1.13 1.006 2.077 1.32 2.37 1.467.294.147.465.123.64-.074.174-.198.743-.865.94-1.161.197-.295.395-.245.664-.147.27.098 1.71.807 2.002.954.294.147.49.22.563.345.074.125.074.723-.17 1.41z"/></svg> WhatsApp</div>
    <div class="status-right"><span>SOS</span><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg><svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg></div>
  </div>
  <div class="header"><div class="title">BUG DEV PAPINO</div></div>
  <div id="alertMsg" class="msg"></div>

  <!-- CONNEXION -->
  <div class="auth-container active" id="loginSection">
    <div class="action-card">
      <div class="row-title">CONNEXION</div>
      <div class="row-input"><input type="text" id="loginUser" placeholder="Numéro ou Nom d'utilisateur"></div>
      <div class="row-input"><input type="password" id="loginPass" placeholder="Mot de passe"></div>
      <button class="btn" id="btnLogin">SE CONNECTER</button>
    </div>
    <div class="switch-link">Pas encore de compte ? <span onclick="toggleAuth('register')">S'inscrire</span></div>
  </div>

  <!-- INSCRIPTION -->
  <div class="auth-container" id="registerSection">
    <div class="action-card">
      <div class="row-title">INSCRIPTION</div>
      <label class="avatar-upload" for="profilePic">
        <div class="avatar-circle"><img id="avatarPreview" src="" alt="Aperçu"><span id="avatarText">Ajouter<br>Photo</span></div>
        <input type="file" id="profilePic" accept="image/*">
      </label>
      <div class="row-input"><input type="text" id="regName" placeholder="Nom complet (ex: Papino G)"></div>
      <div class="row-input"><input type="tel" id="regPhone" placeholder="Numéro de téléphone"></div>
      <div class="row-input"><input type="password" id="regPass" placeholder="Mot de passe"></div>
      <button class="btn" id="btnRegister">CRÉER MON COMPTE</button>
    </div>
    <div class="switch-link">Déjà un compte ? <span onclick="toggleAuth('login')">Se connecter</span></div>
  </div>
</div>
<div class="footer">Powered by DEV PAPINO ©2026</div>

<script>
// Sécurité : Si l'utilisateur est déjà connecté, on le redirige direct vers l'index
if (localStorage.getItem('galsenapp_user')) {
  window.location.href = 'index.html';
}

const bgv = document.getElementById('bgv');
if (bgv) { bgv.muted = true; bgv.play().catch(() => {}); addEventListener('pointerdown', () => bgv.play().catch(() => {}), { once: true }); }
function updateClock() { const now = new Date(); document.getElementById('clock').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`; }
updateClock(); setInterval(updateClock, 60000);

function toggleAuth(section) {
  document.getElementById('loginSection').classList.remove('active');
  document.getElementById('registerSection').classList.remove('active');
  if (section === 'login') document.getElementById('loginSection').classList.add('active');
  else document.getElementById('registerSection').classList.add('active');
  document.getElementById('alertMsg').className = 'msg';
}

const profilePicInput = document.getElementById('profilePic');
const avatarPreview = document.getElementById('avatarPreview');
const avatarText = document.getElementById('avatarText');
profilePicInput.addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(event) { avatarPreview.src = event.target.result; avatarPreview.style.display = 'block'; avatarText.style.display = 'none'; }
    reader.readAsDataURL(file);
  }
});

function showMessage(text, type) { const msg = document.getElementById('alertMsg'); msg.textContent = text; msg.className = 'msg ' + type; }

// CONNEXION
document.getElementById('btnLogin').addEventListener('click', () => {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  if (!user || !pass) { showMessage('Veuillez remplir tous les champs.', 'error'); return; }

  showMessage('Connexion en cours...', 'success');
  setTimeout(() => {
    // On enregistre l'utilisateur dans la mémoire du navigateur
    localStorage.setItem('galsenapp_user', JSON.stringify({ name: user, phone: user }));
    showMessage('Connexion réussie ! Redirection...', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
  }, 1000);
});

// INSCRIPTION
document.getElementById('btnRegister').addEventListener('click', () => {
  const name = document.getElementById('regName').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const pass = document.getElementById('regPass').value.trim();
  const file = profilePicInput.files[0];

  if (!name || !phone || !pass) { showMessage('Veuillez remplir tous les champs.', 'error'); return; }
  if (!file) { showMessage('Veuillez ajouter une photo de profil.', 'error'); return; }

  showMessage('Création du compte en cours...', 'success');
  setTimeout(() => {
    // On enregistre l'utilisateur dans la mémoire du navigateur
    localStorage.setItem('galsenapp_user', JSON.stringify({ name: name, phone: phone, avatar: avatarPreview.src }));
    showMessage('Compte créé avec succès ! Redirection...', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
  }, 1000);
});
</script>
</body>
</html>
