<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GalsenApp</title>
<script>try{var t=localStorage.getItem("th");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pg" id="side">
 <div class="head"><h2>GalsenApp</h2>
  <button class="ib" id="cam" aria-label="Appareil photo"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  <button class="ib" id="dots" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/></svg></button>
 </div>
 <div id="menu" class="hide"><button id="mset">Paramètres</button><button id="madm" class="hide">Admin</button><button id="out">Déconnexion</button></div>
 <div id="searchw"><input id="search" placeholder="Rechercher un nom ou un numéro…" aria-label="Rechercher"></div>
 <div id="list"></div>
 <button id="fab" aria-label="Nouvelle discussion"><svg class="i" viewBox="0 0 24 24"><path d="M5 5h14v10H10l-5 4z"/><path d="M12 7.5v5M9.5 10h5"/></svg></button>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script src="firebase.js"></script>
<script>
requireUser(me => {
  mountTabs("chats");
  if (me.email.toLowerCase() === OWNER_EMAIL.toLowerCase()) $("#madm").classList.remove("hide");
  let users = [], info = {}, subs = {}, lastRead = {};
  try { lastRead = JSON.parse(localStorage.getItem("gl") || "{}"); } catch (e) {}
  const rk = id => me.uid + ":" + id;
  const pv = m => m.type === "voice" ? "🎤 Message vocal" : m.type === "image" ? "📷 Photo" : m.type === "sticker" ? "Sticker " + m.text : m.text;
  db.collection("users").onSnapshot(s => { users = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.id !== me.uid); render(); }, e => showAppError("Impossible de charger les utilisateurs. Vérifiez les règles Firestore."));
  function watch(id) {
    if (subs[id]) return; subs[id] = 1;
    msgsOf(id).orderBy("at").limitToLast(30).onSnapshot(s => {
      const a = s.docs.map(d => d.data()), lr = lastRead[rk(id)] || 0;
      info[id] = { last: a[a.length - 1], u: a.filter(m => m.from !== me.uid && m.at && m.at.toMillis() > lr).length };
      render();
    }, e => showAppError("Impossible de charger une discussion. Vérifiez les règles Firestore."));
  }
  function render() {
    const q = $("#search").value.toLowerCase().trim(), qd = digits(q), l = $("#list");
    const rows = [{ id: ANN, title: "Annonces GalsenApp", sub: "Informations officielles", ann: true }]
      .concat(users.map(u => ({ id: cidOf(me.uid, u.id), title: u.name || u.email, sub: u.email, phone: u.phone, u })));
    rows.forEach(r => watch(r.id));
    const ts = r => info[r.id] && info[r.id].last && info[r.id].last.at ? info[r.id].last.at.toMillis() : 0;
    const tot = rows.reduce((n, r) => n + ((info[r.id] || {}).u || 0), 0);
    const f = rows.filter(r => !q || (r.title + " " + r.sub).toLowerCase().includes(q) || (qd.length >= 3 && digits(r.phone).includes(qd)));
    f.sort((a, b) => a.ann ? -1 : b.ann ? 1 : ts(b) - ts(a));
    l.innerHTML = "";
    f.forEach(r => {
      const i = info[r.id] || {}, last = i.last, b = document.createElement("button");
      b.className = "item";
      b.innerHTML = '<div class="av"></div><div class="bx"><div class="r1"><b></b><span class="tm"></span></div><div class="r2"><span class="lm"></span><span class="bd hide"></span></div></div>';
      const av = b.querySelector(".av"); setAv(av, r.u, r.ann); av.classList.toggle("o", !r.ann && online(r.u));
      b.querySelector("b").textContent = r.title;
      const tm = b.querySelector(".tm"); tm.textContent = last && last.at ? fmt(last.at.toDate()) : ""; tm.classList.toggle("u", !!i.u);
      b.querySelector(".lm").textContent = last ? (last.from === me.uid ? "Vous : " : "") + pv(last) : r.sub;
      const bd = b.querySelector(".bd"); if (i.u) { bd.textContent = i.u; bd.classList.remove("hide"); }
      b.onclick = () => { location.href = "chat.html?id=" + encodeURIComponent(r.id); };
      l.appendChild(b);
    });
    const tb = $("#tbd"); tb.textContent = tot > 99 ? "99+" : tot; tb.classList.toggle("hide", !tot);
  }
  setInterval(render, 30000);
  $("#search").oninput = render;
  $("#cam").onclick = () => alert("La caméra arrive bientôt.");
  $("#dots").onclick = () => $("#menu").classList.toggle("hide");
  document.addEventListener("click", e => { if (!e.target.closest("#dots,#menu")) $("#menu").classList.add("hide"); });
  $("#fab").onclick = () => { $("#list").scrollTop = 0; $("#search").focus(); };
  $("#mset").onclick = () => { location.href = "parametres.html"; };
  $("#madm").onclick = () => { location.href = "admin.html"; };
  $("#out").onclick = () => auth.signOut();
});
</script>
</body>
</html>
