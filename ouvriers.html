<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>App Maçon – Ouvriers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"></div>
<main class="pagew">
 <header class="hd"><div class="avt" id="avt" role="button" aria-label="Mon compte"></div><div class="sp"></div>
  <button class="rb2" id="sb" aria-label="Rechercher"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button></header>
 <h1 class="hello">Ouvriers</h1>
 <p class="role" id="sub"></p>
 <input id="qw" class="hide" placeholder="Chercher un nom, un métier ou un lieu…" aria-label="Chercher">
 <div class="chips"><button class="on" data-f="all">Tous</button><button data-f="actif">Actifs</button><button data-f="inactif">Inactifs</button></div>
 <div class="sech"><h2>Équipe</h2><span id="cnt">0</span></div>
 <div id="wl"></div>
</main>
<nav id="nav"><button data-v="home"><svg viewBox="0 0 24 24"><path class="duo" d="M4.5 11.2 12 4.2l7.5 7v8.3a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1z"/><path d="M9.5 20.5v-4.8a2.5 2.5 0 0 1 5 0v4.8"/><path d="M16.2 7.200V4.500h2v4.600"/></svg><span>Accueil</span></button><button data-v="work"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg><span>Travail</span></button><button class="on" data-v="crew"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17.5 14c2.8 0 4 1.8 4 5"/></svg><span>Ouvriers</span></button><button data-v="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>Compte</span></button></nav>
<div id="sheet" class="hide"><div class="sh2"><h3 id="sn"></h3><p id="sm"></p><button class="go" id="outb">Se déconnecter</button><button class="cx" id="cx">Fermer</button></div></div>
<div id="toast" class="hide"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script src="firebase.js"></script>
<script>
// ---- 5 ouvriers de démonstration (à remplacer plus tard par Firebase) ----
const OUVRIERS = [
  { nom: "Moussa Diop",     age: 34, lieu: "Thiaroye, Dakar",     metier: "Maçon",         actif: true },
  { nom: "Ibrahima Ndiaye", age: 41, lieu: "Pikine, Dakar",       metier: "Chef de chantier", actif: true },
  { nom: "Cheikh Fall",     age: 28, lieu: "Guédiawaye",          metier: "Ferrailleur",   actif: true },
  { nom: "Abdoulaye Sow",   age: 37, lieu: "Rufisque",            metier: "Carreleur",     actif: true },
  { nom: "Mamadou Ba",      age: 45, lieu: "Parcelles Assainies", metier: "Plâtrier",      actif: false }
];
const ini = s => s.trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
const toast = t => { const e = $("#toast"); e.textContent = t; e.classList.remove("hide"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add("hide"), 1800); };
const PIN = '<svg viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11a7 7 0 0 0-14 0c0 5.400 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
const AGE = '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>';
const TOOL = '<svg viewBox="0 0 24 24"><path d="M14.500 6.500a4 4 0 0 0 4.800 4.800L20 12l-8 8-5-5 8-8z"/><path d="M4 20l3-3"/></svg>';
auth.onAuthStateChanged(u => {
  if (!u || !u.emailVerified) { if (u) auth.signOut(); location.replace("index.html"); return; }
  const patron = u.email.toLowerCase() === OWNER_EMAIL.toLowerCase(), n = u.displayName || u.email;
  $("#avt").textContent = ini(n); $("#sn").textContent = n; $("#sm").textContent = u.email + (patron ? " · Patron" : " · Maçon");
  let f = "all", q = "";
  function draw() {
    const ql = q.toLowerCase();
    const list = OUVRIERS.filter(o => (f === "all" || (f === "actif") === o.actif) && (!ql || (o.nom + " " + o.metier + " " + o.lieu).toLowerCase().includes(ql)));
    const nb = OUVRIERS.filter(o => o.actif).length;
    $("#sub").textContent = OUVRIERS.length + " ouvriers · " + nb + " actifs aujourd’hui";
    $("#cnt").textContent = list.length;
    const box = $("#wl"); box.innerHTML = ""; box.className = "";
    if (!list.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "Aucun résultat."; box.appendChild(e); return; }
    box.className = "wg";
    list.forEach(o => {
      const r = document.createElement("div"); r.className = "wc";
      r.innerHTML = '<div class="ph"></div><div class="wn"></div><div class="wl m">' + TOOL + '<span></span></div><div class="wl a">' + AGE + '<span></span></div><div class="wl h">' + PIN + '<span></span></div><div class="wst"><i class="live"></i><b></b></div>';
      const ph = r.querySelector(".ph");
      if (o.photo) { const im = document.createElement("img"); im.src = o.photo; im.alt = ""; ph.appendChild(im); } else ph.textContent = ini(o.nom);
      r.querySelector(".wn").textContent = o.nom;
      r.querySelector(".m span").textContent = o.metier;
      r.querySelector(".a span").textContent = o.age + " ans";
      r.querySelector(".h span").textContent = o.lieu;
      r.querySelector(".live").classList.toggle("off", !o.actif);
      const st = r.querySelector(".wst"); st.classList.toggle("off", !o.actif); st.querySelector("b").textContent = o.actif ? "Actif" : "Inactif";
      box.appendChild(r);
    });
  }
  document.querySelectorAll(".chips button").forEach(b => b.onclick = () => {
    document.querySelectorAll(".chips button").forEach(x => x.classList.toggle("on", x === b)); f = b.dataset.f; draw();
  });
  $("#sb").onclick = () => { $("#qw").classList.toggle("hide"); if (!$("#qw").classList.contains("hide")) $("#qw").focus(); };
  $("#qw").oninput = e => { q = e.target.value; draw(); };
  const sheet = v => $("#sheet").classList.toggle("hide", !v);
  $("#avt").onclick = () => { location.href = "compte.html"; }; $("#cx").onclick = () => sheet(false);
  $("#sheet").onclick = e => { if (e.target.id === "sheet") sheet(false); };
  $("#outb").onclick = () => auth.signOut();
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    if (v === "home") location.href = "accueil.html"; else if (v === "me") location.href = "compte.html"; else if (v === "work") toast("Bientôt disponible");
  });
  draw();
});
</script>
</body>
</html>
